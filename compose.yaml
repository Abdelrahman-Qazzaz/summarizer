# Runs the whole backend locally, and doubles as the reference topology for
# whichever platform this is deployed to: one migrate one-shot that must finish
# first, then the API, the worker (scale this one), and the YouTube fetcher.
#
#   doppler run -- docker compose up --build
#
# Secrets are passed through from the environment rather than read from a file:
# the .env files only carry DOPPLER_TOKEN, and this keeps plaintext secrets off
# disk. Each service lists exactly what it needs, which is also the list to
# paste into whichever host you deploy to.
#
# Postgres, Redis and object storage are managed services (Supabase, Upstash)
# and are not started here. RabbitMQ is whatever MQ_URL points at — if that is
# a broker on your own machine, use host.docker.internal rather than localhost,
# which inside a container means the container.

name: summarizer

services:
  # Must complete before anything that touches the database starts. Needs only
  # DATABASE_URL, not the application's other secrets.
  migrate:
    build:
      context: ./backend
    command: ["node", "dist/migrate.js"]
    environment:
      - DATABASE_URL
    restart: "no"

  api:
    build:
      context: ./backend
    command: ["node", "dist/api.js"]
    environment:
      - DATABASE_URL
      - MQ_URL
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - OPENROUTER_API_KEY
      - DEEPGRAM_API_KEY
      - SESSION_SECRET
      - WORKOS_API_KEY
      - WORKOS_CLIENT_ID
      - CLIENT_URL
      - API_BASE_URL
      - UPSTASH_REDIS_REST_URL
      - UPSTASH_REDIS_REST_TOKEN
      - PORT
      - WS_PORT
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
      - "${WS_PORT:-4000}:${WS_PORT:-4000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # `node -e` rather than curl: the alpine image has no curl, and fetch is
      # global on Node 22.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Competing consumers on one queue: `docker compose up --scale
  # transcribe-worker=3` is the whole scaling story.
  transcribe-worker:
    build:
      context: ./backend
    command: ["node", "dist/transcribe-worker.js"]
    environment:
      - DATABASE_URL
      - MQ_URL
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - OPENROUTER_API_KEY
      - DEEPGRAM_API_KEY
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Reads queue and bucket names from the API's /contract at boot, so it waits
  # for the API to be healthy rather than merely started.
  youtube-fetcher:
    build:
      context: ./youtube-fetcher
    environment:
      - MQ_URL
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      # Deliberately not the API_BASE_URL the API itself uses: that one is the
      # public URL WorkOS redirects back to, while this is one container
      # calling another over the compose network.
      - API_BASE_URL=http://api:${PORT:-3001}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
